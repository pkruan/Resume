<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Profile Generator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: none;
}

textarea {
  height: 80px;
}

button {
  background: #22c55e;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

#result {
  margin-top: 15px;
  padding: 10px;
  background: black;
  border-radius: 8px;
  min-height: 80px;
  white-space: pre-line;
}
</style>

</head>
<body>

<div class="container">
  <h2>AI Resume Profile Generator</h2>

  <input id="name" placeholder="ชื่อ">
  <input id="job" placeholder="อาชีพ / ตำแหน่งงาน">
  <input id="skills" placeholder="ทักษะ เช่น HTML, Marketing, Sales">
  <textarea id="experience" placeholder="ประสบการณ์ทำงาน"></textarea>
  <textarea id="goal" placeholder="เป้าหมายในอนาคต"></textarea>

  <button onclick="generateProfile()">Generate Profile</button>

  <h3>ผลลัพธ์:</h3>
  <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
