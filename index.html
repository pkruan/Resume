 <!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume Profile Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>AI Resume Profile Generator</h1>

  <input id="name" placeholder="ชื่อ"><br>
  <input id="job" placeholder="อาชีพ / ตำแหน่งงาน"><br>
  <input id="skills" placeholder="ทักษะ (เช่น HTML, Marketing, Sales)"><br>
  <textarea id="experience" placeholder="ประสบการณ์ทำงาน"></textarea><br>
  <textarea id="goal" placeholder="เป้าหมายในอนาคต"></textarea><br>

  <h3>เลือกสไตล์ Resume</h3>
  <button onclick="setStyle('pro')">Professional</button>
  <button onclick="setStyle('creative')">Creative</button>
  <button onclick="setStyle('startup')">Startup Founder</button>

  <br><br>

  <button onclick="generateProfile()">Generate Profile</button>
  <button onclick="copyResume()">Copy Resume</button>
  <button onclick="downloadResume()">Download .txt</button>
  <button onclick="toggleMode()">Dark / Light</button>

  <h2>ผลลัพธ์:</h2>
  <pre id="result"></pre>

  <script src="script.js"></script>
</body>
</html>
